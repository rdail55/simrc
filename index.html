<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stage Vis</title>
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/build/three.module.js",
        "three/addons/": "./vendor/three/examples/jsm/",
        "fflate": "./vendor/fflate/esm/browser.js"
      }
    }
  </script>
  <style>
    :root { --bg: #0d0e11; --panel: #15171b; --line: #262a31; --text: #d9dce2; --dim: #8a909b; --accent: #4da3ff; --warn: #f0a33a; --bad: #ef5a5a; --good: #3fcf7f; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { display: grid; grid-template-rows: auto 1fr; overflow: hidden; }
    header { display: flex; gap: 6px; align-items: center; padding: 6px 10px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
    .brand { font-weight: 700; margin-right: 8px; } .brand span { color: var(--accent); }
    .btn { background: #22262d; color: var(--text); border: 1px solid #323741; border-radius: 6px; padding: 4px 9px; font: inherit; cursor: pointer; white-space: nowrap; }
    .btn:hover { background: #2a2f38; } .btn.on { background: var(--accent); border-color: var(--accent); color: #fff; }
    .sep { width: 1px; height: 20px; background: var(--line); margin: 0 4px; }
    .spacer { flex: 1; }
    .pill { padding: 2px 8px; border-radius: 10px; background: #22262d; color: var(--dim); font-size: 12px; }
    .pill.good { color: var(--good); } .pill.warn { color: var(--warn); } .pill.bad { color: var(--bad); }
    header label.sl { display: flex; align-items: center; gap: 4px; color: var(--dim); font-size: 12px; }
    header input[type=range] { width: 80px; }
    main { display: grid; grid-template-columns: 230px 1fr 300px; min-height: 0; }
    aside { background: var(--panel); overflow: auto; min-height: 0; }
    aside.left { border-right: 1px solid var(--line); } aside.right { border-left: 1px solid var(--line); }
    #view { position: relative; min-width: 0; min-height: 0; }
    #view canvas { display: block; }
    #hint { position: absolute; left: 10px; bottom: 8px; color: var(--dim); font-size: 12px; pointer-events: none; text-shadow: 0 1px 2px #000; }
    #offline { position: absolute; top: 10px; right: 10px; max-width: 340px; background: rgba(21,23,27,.94); border: 1px solid #3a2f22; color: var(--text); padding: 9px 12px; border-radius: 8px; font-size: 12px; display: none; }
    #offline b { color: var(--warn); }
    #placing { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: var(--accent); color: #fff; padding: 5px 12px; border-radius: 6px; display: none; }
    h3 { margin: 0; padding: 8px 10px 6px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); display: flex; align-items: center; gap: 6px; }
    h3 .btn { padding: 1px 7px; font-size: 11px; text-transform: none; letter-spacing: 0; }
    .list .row { display: flex; align-items: center; gap: 7px; padding: 4px 10px; cursor: pointer; border-left: 2px solid transparent; }
    .list .row:hover { background: #1c1f25; } .list .row.sel { background: #1d2a3a; border-left-color: var(--accent); }
    .sw { width: 12px; height: 12px; border-radius: 3px; background: #000; border: 1px solid #333; flex: none; }
    .list .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .list .ad { color: var(--dim); font-size: 11px; font-variant-numeric: tabular-nums; }
    .list .grp { padding: 8px 10px 2px; color: var(--dim); font-size: 11px; }
    .tabs { display: flex; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); z-index: 1; }
    .tabs button { flex: 1; background: none; border: 0; color: var(--dim); padding: 8px; font: inherit; cursor: pointer; border-bottom: 2px solid transparent; }
    .tabs button.on { color: var(--text); border-bottom-color: var(--accent); }
    .pane { padding: 4px 10px 14px; } .pane.hidden { display: none; }
    .f { display: grid; grid-template-columns: 82px 1fr; gap: 6px; align-items: center; margin: 5px 0; }
    .f > span { color: var(--dim); font-size: 12px; }
    .f3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px; }
    input[type=text], input[type=number], select { width: 100%; background: #0f1114; color: var(--text); border: 1px solid #2d323b; border-radius: 5px; padding: 3px 6px; font: inherit; min-width: 0; }
    .note { color: var(--dim); font-size: 12px; margin: 6px 0; }
    .note b { color: var(--text); }
    .warn { color: var(--warn); } .bad { color: var(--bad); }
    .btns { display: flex; gap: 5px; flex-wrap: wrap; margin: 8px 0; }
    table.ch { width: 100%; border-collapse: collapse; font-size: 11px; font-variant-numeric: tabular-nums; }
    table.ch td { padding: 1px 3px; border-bottom: 1px solid #1f2329; } table.ch td:last-child { text-align: right; }
    .bar { display: inline-block; height: 6px; background: var(--accent); vertical-align: middle; margin-right: 4px; }
    .uni { padding: 5px 0; border-bottom: 1px solid var(--line); font-size: 12px; }
    .uni .t { display: flex; justify-content: space-between; } .uni .s { color: var(--dim); font-size: 11px; }
    .drop { position: fixed; inset: 0; background: rgba(77,163,255,.15); border: 3px dashed var(--accent); display: none; align-items: center; justify-content: center; font-size: 20px; z-index: 10; pointer-events: none; }
    .drop.on { display: flex; }
    #toast { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); background: #22262d; border: 1px solid #333; padding: 7px 14px; border-radius: 7px; display: none; z-index: 11; }
  </style>
</head>
<body>
  <header>
    <div class="brand">Stage<span>Vis</span></div>
    <label class="btn" title="Open a scene exported from Capture, Vectorworks… (.mvr)">Open MVR<input type="file" id="open-mvr" accept=".mvr" hidden></label>
    <label class="btn" title="Fixture data: .gdtf files from GDTF Share, or a Lightkey project for its fixture profiles">Fixture files<input type="file" id="open-lib" accept=".gdtf,.lightkeyproj" multiple hidden></label>
    <div class="sep"></div>
    <select id="add-type" title="Fixture type to place" style="width:190px"></select>
    <button class="btn" id="add" title="Click in the 3D view to place it (A)">Place light</button>
    <div class="sep"></div>
    <button class="btn" data-view="foh">FOH</button><button class="btn" data-view="top">Top</button><button class="btn" data-view="side">Side</button><button class="btn" data-view="stage">Stage</button>
    <div class="sep"></div>
    <label class="sl">Haze <input type="range" id="haze" min="0" max="1.5" step="0.05"></label>
    <label class="sl">House <input type="range" id="house" min="0" max="1" step="0.02"></label>
    <div class="spacer"></div>
    <span class="pill" id="p-bridge">Bridge</span><span class="pill" id="p-dmx">DMX</span><span class="pill" id="p-ndi">Screen</span>
    <div class="sep"></div>
    <button class="btn" id="save" title="Download this layout (.json)">Save layout</button>
    <label class="btn" title="Open a saved layout (.json)">Open layout<input type="file" id="open-layout" accept=".json" hidden></label>
  </header>
  <main>
    <aside class="left">
      <h3>Fixtures <span id="count"></span><span class="spacer"></span><button class="btn" id="add-missing" title="Place the Lightkey project's fixtures that aren't in the MVR yet">+ from Lightkey</button></h3>
      <div class="list" id="list"></div>
    </aside>
    <section id="view"><div id="offline"></div><div id="placing">Click where the light goes · Esc to cancel</div><div id="hint">Drag to orbit · right-drag to pan · scroll to zoom · click a light to select · W move · E rotate · ⌫ delete · ⌘D duplicate</div></section>
    <aside class="right">
      <div class="tabs"><button data-tab="fixture" class="on">Fixture</button><button data-tab="inputs">Inputs</button><button data-tab="library">Library</button></div>
      <div class="pane" id="tab-fixture"></div>
      <div class="pane hidden" id="tab-inputs"></div>
      <div class="pane hidden" id="tab-library"></div>
    </aside>
  </main>
  <div class="drop" id="drop">Drop .mvr, .gdtf, .lightkeyproj or a layout .json</div>
  <div id="toast"></div>
  <script type="module" src="src/vis/app.js"></script>
</body>
</html>
